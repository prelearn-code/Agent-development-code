[project]
name = "Agent-development-code"
version = "0.0.1"
description = "Local Professional Agent Platform - 学习项目（Phase 0 骨架）"
requires-python = ">=3.12"
# 依赖按里程碑分组加入，不要一次装全。
#   M1: pydantic / httpx / pydantic-settings
#   M2: fastapi / uvicorn / sqlalchemy / asyncpg / alembic
#   M3: qdrant-client / pymupdf / rank-bm25 / jieba
#   M4: mcp / langgraph / langgraph-checkpoint-postgres
dependencies = []

[project.optional-dependencies]
m1 = ["pydantic>=2.9", "httpx>=0.27", "pydantic-settings>=2.6"]
m2 = ["fastapi>=0.115", "uvicorn[standard]>=0.32", "sqlalchemy[asyncio]>=2.0.36",
      "asyncpg>=0.30", "alembic>=1.14"]
m3 = ["qdrant-client>=1.12", "pymupdf>=1.24", "rank-bm25>=0.2.2", "jieba>=0.42.1"]
m4 = ["mcp>=1.0", "langgraph>=0.2.60", "langgraph-checkpoint-postgres>=2.0"]
# Reranker / 本地 embedding 需要 torch，体积约 2.5GB，M3 后段才装
ml = ["torch==2.7.1", "FlagEmbedding>=1.3", "transformers>=4.45"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "pytest-cov>=6.0", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages", "tools", "minimal_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "tools/tests", "verifier/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages", "tools", "services", "minimal_agent", "pipelines", "graph", "memory", "verifier"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID"]
# 分层护栏：core 不允许 import 上层模块（配合 scripts/check_layering.py）
[tool.ruff.lint.flake8-tidy-imports.banned-api]
# 占位：具体禁用在 scripts/check_layering.py 里做 AST 检查，ruff 规则不足以表达分层

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
