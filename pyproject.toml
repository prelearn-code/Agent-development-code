[project]
name = "Agent-development-code"
version = "0.0.1"
description = "密码工具 Agent - 逐步交付的学习骨架"
requires-python = ">=3.12"
# 依赖组名保留兼容，执行顺序按V0-V6；不要一次装全。
#   M1: pydantic / httpx（pydantic-settings 为基础配置依赖）
#   M2: fastapi / uvicorn / sqlalchemy / asyncpg / alembic
#   M3: qdrant-client / pymupdf / rank-bm25 / jieba
#   M4: mcp / langgraph / langgraph-checkpoint-postgres
dependencies = [
    "jsonschema>=4.20.0",
    "mcp>=2.3.0",
    "numpy>=1.26.2",
    "pydantic-settings>=2.6",
]

[project.scripts]
crypto-agent = "packages.app.cli:main"

[project.optional-dependencies]
m1 = ["pydantic>=2.9", "httpx>=0.27"]
m2 = ["fastapi>=0.115", "uvicorn[standard]>=0.32", "sqlalchemy[asyncio]>=2.0.36",
      "asyncpg>=0.30", "alembic>=1.14"]
m3 = ["qdrant-client>=1.12", "pymupdf>=1.24", "rank-bm25>=0.2.2", "jieba>=0.42.1"]
m4 = ["mcp>=1.0", "langgraph>=0.2.60", "langgraph-checkpoint-postgres>=2.0"]
# V5检索路线需要时才引入ml；实际硬件/版本按指南验证
mcp = ["mcp>=1.0"]
workflow = ["langgraph>=0.2.60", "langgraph-checkpoint-postgres>=2.0"]
ml = ["torch==2.7.1", "FlagEmbedding>=1.3", "transformers>=4.45"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "pytest-cov>=6.0", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages", "tools", "mcp_integration"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "tools/tests", "verifier/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages", "tools", "services", "pipelines", "graph", "memory", "verifier", "mcp_integration"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID"]
# 分层护栏：core 不允许 import 上层模块（配合 scripts/selftest.py）
[tool.ruff.lint.flake8-tidy-imports.banned-api]
# 占位：具体禁用在 scripts/selftest.py 里做 AST 检查，ruff 规则不足以表达分层

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
